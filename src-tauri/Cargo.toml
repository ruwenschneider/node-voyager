[package]
name = "node-voyager"
version = "0.1.0"
description = "Native macOS OPC UA telemetry station"
edition = "2021"
license = "MIT"

[lib]
name = "node_voyager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
async-opcua = { version = "0.19.0", default-features = false, features = ["client"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
